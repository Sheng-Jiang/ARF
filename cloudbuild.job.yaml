substitutions:
  _GCS_BUCKET: arf-data-ai-rf
  _REGION: asia-east1
  _JOB: arf-pipeline
  _AR_REPO: arf

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.job
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_JOB}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_JOB}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run jobs describe ${_JOB} --region=${_REGION} >/dev/null 2>&1 \
          && ACTION=update || ACTION=create
        gcloud run jobs $$ACTION ${_JOB} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_JOB} \
          --region=${_REGION} \
          --memory=1Gi \
          --cpu=1 \
          --task-timeout=30m \
          --max-retries=1 \
          --set-env-vars=OUTPUT_TARGET=gcs,GCS_BUCKET=${_GCS_BUCKET},GCS_DB_OBJECT=arf.db,TRIGGER_SOURCE=scheduler \
          --update-secrets=GEMINI_API_KEY=gemini-api-key:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_JOB}

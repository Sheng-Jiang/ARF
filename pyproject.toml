[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arf"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "yfinance>=0.2.50",
    "baostock>=0.8.8",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "plotly>=5.22",
    "pyyaml>=6.0",
    "requests>=2.32",
    "tenacity>=8.3",
    "rich>=13.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
webapp = [
    "streamlit>=1.35",
    "google-cloud-storage>=2.16",
]

[project.scripts]
arf-run = "arf.run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["arf*", "webapp*"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (require network access)",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["arf"]

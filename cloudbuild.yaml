substitutions:
  _GCS_BUCKET: arf-data-ai-rf
  _REGION: asia-east1
  _SERVICE: arf-webapp
  _AR_REPO: arf

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}
      - --region=${_REGION}
      - --platform=managed
      - --min-instances=0
      - --max-instances=1
      - --no-allow-unauthenticated
      - --memory=512Mi
      - --cpu=1
      - --set-env-vars=DATA_SOURCE=gcs,GCS_BUCKET=${_GCS_BUCKET},GCS_DB_OBJECT=arf.db,GCP_PROJECT=$PROJECT_ID,GCP_REGION=${_REGION},PIPELINE_JOB=arf-pipeline
      - --update-secrets=GEMINI_API_KEY=gemini-api-key:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}

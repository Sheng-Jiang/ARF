substitutions:
  _GCS_BUCKET: arf-data
  _REGION: us-central1
  _SERVICE: arf-webapp

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/${_SERVICE}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/${_SERVICE}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=gcr.io/$PROJECT_ID/${_SERVICE}
      - --region=${_REGION}
      - --platform=managed
      - --min-instances=0
      - --max-instances=1
      - --no-allow-unauthenticated
      - --memory=512Mi
      - --cpu=1
      - --set-env-vars=DATA_SOURCE=gcs,GCS_BUCKET=${_GCS_BUCKET},GCS_DB_OBJECT=arf.db

images:
  - gcr.io/$PROJECT_ID/${_SERVICE}

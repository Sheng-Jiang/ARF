# 双价值链 (dual AI value-chain) market-cap snapshot — constituent registry.
#
# Line 1 = US-led chain, Line 2 = China-led chain, both broken into the same
# 5-layer stack used on the 双价值链 webapp page. This taxonomy is bespoke to
# this page (grouped by "who competes with whom", e.g. cloud hyperscalers are
# grouped under L3 infra here) and intentionally does not reuse the layer
# field in config/universe.yaml, which is assigned per ARF's own scoring
# logic.
#
# Each constituent has a `source`:
#   universe — ticker belongs to the *scored* US/China leg (36+36 names) that
#              arf.run.fetch_all() already fetches every run; reuse that day's
#              market_cap_usd instead of a second fetch. NOTE: universe.yaml's
#              Europe-ref and Pre-IPO legs are NOT fetched by fetch_all (they
#              return null "manual" StockData) even though they're tickers in
#              that file — those must use `extra`, not `universe`.
#   extra    — publicly traded but not covered by fetch_all above (includes
#              Europe-ref tickers like ASML/SAP/ABB); fetched directly via
#              fetch_us/fetch_china each run.
#   static   — private / pre-IPO, no market price to fetch. static_usd_b is a
#              manually maintained valuation (last funding round / secondary
#              trade) — update by hand when better information is available,
#              same convention as the Pre-IPO tier in universe.yaml.
#
# Companies the source report couldn't cleanly value (国家电网, 海光, 宇树,
# KUKA/Universal Robots after going private/subsidiary) are omitted rather
# than guessed, matching the original report's own "未计 / 未细列" caveats.
#
# Note: SMEGF (Siemens Energy) and ABBNY (ABB) are the yfinance-valid USD OTC
# ADR tickers, which differ from universe.yaml's SMEGY/ABB — those entries are
# never fetched by arf.run.fetch_all() (Europe-ref is skipped there), so the
# ticker mismatch was never exercised until this page needed a live fetch.

layers:
  - layer: L1
    name: "L1 能源"
    US:
      - name: "NextEra"
        ticker: NEE
        source: universe
      - name: "Williams"
        ticker: WMB
        source: universe
      - name: "GE Vernova"
        ticker: GEV
        source: extra
      - name: "西门子能源"
